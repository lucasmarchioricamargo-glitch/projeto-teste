<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 158" width="268" height="158" role="img" aria-label="Extensivo ENARE — logo cor">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Playfair+Display:ital@1&amp;family=Space+Grotesk:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Barra vertical Teal — conector de identidade Residência PRO -->
  <rect x="0" y="10" width="4" height="136" rx="2" fill="#0D8A8D"/>

  <!-- "extensivo" — Playfair Display italic, qualificador do produto -->
  <text x="18" y="38"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="16"
    fill="#0D8A8D">extensivo</text>

  <!-- "ENARE" — Barlow Condensed 800, protagonista -->
  <text x="16" y="112"
    font-family="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif"
    font-weight="800"
    font-size="82"
    fill="#1F5C23">ENARE</text>

  <!-- "by Residência PRO" — endosso -->
  <text x="18" y="138"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="13"
    fill="#9E9B94">by Residência PRO</text>
</svg>
