<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Extensivo ENARE — ícone">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&amp;display=swap');
    </style>
  </defs>

  <!--
    Solução para a limitação do ícone:
    Em vez de barra solta + "E" flutuando, usamos um container quadrado
    com a barra Teal como borda esquerda dominante — cria o mesmo DNA
    visual da Proposta B num formato compacto e reconhecível.
  -->

  <!-- Container creme -->
  <rect width="48" height="48" rx="6" fill="#F6F4ED"/>

  <!-- Barra Teal como borda esquerda do container -->
  <rect x="0" y="0" width="6" height="48" rx="3" fill="#0D8A8D"/>

  <!-- "E" em Verde Floresta — centralizado no espaço restante -->
  <text x="29" y="38"
    font-family="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif"
    font-weight="800"
    font-size="36"
    fill="#1F5C23"
    text-anchor="middle">E</text>
</svg>
